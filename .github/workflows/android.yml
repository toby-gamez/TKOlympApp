name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege for the workflow's GITHUB_TOKEN (ISO 27001 A.8.2 / A.8.25).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build
      run: ./gradlew :androidApp:compileDebugKotlin
    - name: Unit tests (shared)
      run: ./gradlew :shared:testAndroidHostTest
    - name: Lint
      # Report-only until existing findings are triaged (or a lint baseline is added); then drop this line.
      continue-on-error: true
      run: ./gradlew :androidApp:lintDebug
    - name: Upload test and lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports
        path: |
          shared/build/reports/tests/
          androidApp/build/reports/lint-results-debug.*
        if-no-files-found: ignore
