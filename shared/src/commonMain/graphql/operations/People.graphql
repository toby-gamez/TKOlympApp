query People($first: Int, $offset: Int) {
    people(first: $first, offset: $offset) {
        nodes {
            id
            image { url }
            firstName
            lastName
            prefixTitle
            suffixTitle
            birthDate
            cohortMembershipsList {
                cohort {
                    name
                    id
                    colorRgb
                    isVisible
                }
            }
        }
    }
}
