query ManagementEventDraft($id: BigInt!) {
  eventInstance: event(id: $id) {
    id name type since until locationId locationText capacity
    isVisible isPublic enableNotes isCancelled summary description
    registrationInfo { registrationOpen }
    eventInstanceTrainersByInstanceIdList: eventTrainersList { personId }
    targetCohortsList { cohortId }
  }
}
