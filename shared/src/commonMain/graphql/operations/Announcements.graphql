query Announcements($sticky: Boolean, $first: Int, $offset: Int) { announcements(condition: { isSticky: $sticky }, first: $first, offset: $offset) { nodes { body createdAt id isSticky status title authorName author { id uJmeno uPrijmeni } updatedAt attachments { nodes { inline file { id name contentType url objectKey isPublic } } } } } }
