query EventDetail($id: BigInt!) {
    eventInstance: event(id: $id) {
        id
        type
        name
        summary
        description
        coverImage { url }
        since
        until
        isCancelled
        capacity
        remainingPersonSpots: registrationInfo { remainingCapacity }
        isLocked
        isVisible
        isPublic
        enableNotes
        managerPersonIds
        locationText
        location {
            id
            name
        }
        eventTrainersList {
            id
            personId
            lessonsOffered
            lessonsRemaining
            person {
                id
                name
                image { url }
            }
        }
        eventInstancesList: childEventsList(orderBy: SINCE_ASC) {
            id
            since
            until
            isCancelled
        }
        eventTargetCohortsList: targetCohortsList {
            cohortId
            cohort {
                id
                name
                colorRgb
            }
        }
        eventRegistrationsList: registrationsList(
            condition: { registrationStatus: ACTIVE }
        ) {
            id
            parentRegistrationId
            note
            personId
            person {
                id
                name
                firstName
                lastName
                image { url }
            }
            coupleId
            couple {
                id
                man {
                    id
                    name
                    firstName
                    lastName
                    image { url }
                }
                woman {
                    id
                    name
                    firstName
                    lastName
                    image { url }
                }
            }
            eventLessonDemandsByRegistrationIdList: lessonRequestsList {
                id
                lessonCount
                trainerId
            }
            createdAt
        }
    }
}
