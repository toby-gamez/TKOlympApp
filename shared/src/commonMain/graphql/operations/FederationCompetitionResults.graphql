query FederationCompetitionResults($id: BigInt!) {
    competition(id: $id) {
        id
        startDate
        competitionType
        status
        participantsTotal
        category {
            name
        }
        officials(first: 50) {
            nodes {
                role
                judgeLabel
                person {
                    canonicalName
                }
            }
        }
        entriesList(first: 300) {
            cancelled
            competitor {
                name
                peopleList(first: 3) {
                    name
                }
            }
        }
        resultsList(first: 300, orderBy: RANKING_ASC) {
            ranking
            rankingTo
            pointGain
            isFinal
            competitor {
                id
                name
                competitorType
                peopleList(first: 3) {
                    name
                }
            }
        }
    }
}
