query PersonBasic($id: BigInt!) {
    person(id: $id) {
        id
        birthDate
        cstsId
        email
        firstName
        prefixTitle
        suffixTitle
        gender
        isTrainer
        lastName
        phone
        wdsfId
        instagramUsername
        tiktokUsername
        facebookUrl
        websiteUrl
        note
        activeCouplesList {
            man { firstName lastName }
            woman { firstName lastName }
            id
        }
        allCouplesList {
            id
            manId
            womanId
            since
            until
            status
        }
        cohortMembershipsList {
            cohort { colorRgb name isVisible id }
            since
            until
        }
        cstsProgressList: federationCategoryProgresses(first: 100) {
      nodes {
        points
        finals: domesticFinals
        foreignFinals
        competitor { name federation }
        category { id name series discipline ageGroup genderGroup class competitorType baseDanceProgramId }
      }
    }
        federationPeople(first: 10) {
            nodes {
                federation externalId canonicalName dob nationality ageGroup
                medicalCheckupExpiration medicalCheckupType
                licenses(first: 30) { nodes { kind discipline grade validUntil status } }
            }
        }
        federationRanklistEntries(first: 50) {
            nodes {
                ranking rankingTo points
                competitor { name federation }
                snapshot { asOfDate ranklist { name federation category { name } } }
            }
        }
        federationCompetitions(first: 30, orderBy: START_DATE_DESC) {
            nodes {
                id federation startDate competitionType status participantsTotal
                category { name }
                event { name city country }
            }
        }
    }
}
