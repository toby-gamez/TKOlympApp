query EventsForRange(
    $condition: EventCondition,
    $calendarFilter: CalendarFilterInput,
    $first: Int,
    $offset: Int
) {
    eventsList(condition: $condition, calendarFilter: $calendarFilter, first: $first, offset: $offset, orderBy: [SINCE_ASC, ID_ASC]) {
        id
        isCancelled
        since
        until
        updatedAt
        name
        description
        type
        locationText
        isVisible
        isPublic
        trainersList: eventTrainersList { person { name image { url } } }
        targetCohortsList { cohortId cohort { id name colorRgb } }
        eventInstanceRegistrationsByInstanceIdList: registrationsList {
            id
            parentRegistrationId
            person { id name firstName lastName }
            couple { id man { firstName lastName } woman { firstName lastName } }
        }
        location { id name }
    }
}
